  spring:
    datasource:
      url: ${DB_URL:jdbc:mysql://localhost:3306/localyze?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      username: ${DB_USERNAME:root}
