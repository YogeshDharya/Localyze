# ===========================
# Server
# ===========================
server.port=8085

# ===========================
# Application Name
# ===========================
spring.application.name=api-gateway

# ===========================
# Eureka
# ===========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===========================
# Actuator
# ===========================
management.endpoints.web.exposure.include=*

# ===========================
# MVC Gateway Discovery
# ===========================
spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

# ===========================
# MVC Gateway Routes
# ===========================
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

# ===========================
# Logging
# ===========================
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.web=DEBUG
