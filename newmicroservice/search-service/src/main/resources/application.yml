server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: search-service
  datasource:
    url: jdbc:mysql://localhost:3309/search_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SEARCH_DB_USER:search_user}
    password: ${SEARCH_DB_PASS:search_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:ao2rnbaz}
  api-key: ${CLOUDINARY_API_KEY:543374969285461}
  api-secret: ${CLOUDINARY_API_SECRET:mkcDK3tnkBPF-YjV9eMIy0SevOU}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

